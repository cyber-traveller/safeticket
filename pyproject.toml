[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "safeticket"
version = "0.1.0"
description = "Local support-ticket routing API with human-review safety gates, plus a reproducible benchmark harness"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["safeticket", "benchmarks"]
